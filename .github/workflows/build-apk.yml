name: Android Build - GitHub

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      artifact:
        description: "Qué quieres compilar"
        required: true
        default: "both"
        type: choice
        options:
          - apk
          - aab
          - both

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm


      - name: Preparar Android SDK
        run: |
          
- name: Preparar Android SDK
  run: |
    echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
    echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
    yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
    "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Compilar APK
        if: ${{ github.event_name == 'push' || github.event.inputs.artifact == 'apk' || github.event.inputs.artifact == 'both' }}
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Compilar AAB
        if: ${{ github.event_name == 'push' || github.event.inputs.artifact == 'aab' || github.event.inputs.artifact == 'both' }}
        working-directory: android
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Guardar APK
        if: ${{ github.event_name == 'push' || github.event.inputs.artifact == 'apk' || github.event.inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: cuida-tus-plantas-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar AAB
        if: ${{ github.event_name == 'push' || github.event.inputs.artifact == 'aab' || github.event.inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: cuida-tus-plantas-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
